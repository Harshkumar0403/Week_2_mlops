name: CI - Dev Branch

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  dev-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Authenticate to Google Cloud
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        echo "$GCP_SA_KEY" > github-dvc-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=github-dvc-key.json
        gcloud auth activate-service-account --key-file=github-dvc-key.json
        gcloud config set project phonic-axle-473506-u8
        gcloud auth list
        gsutil ls gs://mlops-course-phonic-axle-473506-u8-unique

    - name: Pull data and model from DVC
      run: |
        export GOOGLE_APPLICATION_CREDENTIALS=github-dvc-key.json
        dvc pull

    - name: Run tests and generate metrics
      run: |
        pytest -v --disable-warnings -q
        echo "Model evaluation completed" >> metrics.txt
        cat metrics.txt

    - name: Generate Markdown report
      run: |
        echo "## CI Test Report" > report.md
        echo "" >> report.md
        cat metrics.txt >> report.md

    - name: Post report as PR comment
      if: github.event_name == 'pull_request'
      uses: iterative/cml@v0.3.0
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        file: report.md
 
